name: 월간 성과 스냅샷 갱신

on:
  schedule:
    # 매월 1일 07:17 UTC = 16:17 KST. 미국장(13:30~20:00 UTC 진행일 기준)과
    # 한국장(00:00~06:30 UTC) 이 **둘 다 닫혀 있는** 시각 — 장중가 오염 불가.
    # 분은 daily-signal 과 같은 :17 (혼잡한 :00/:30 회피).
    - cron: '17 7 1 * *'
  workflow_dispatch:        # 수동 실행 버튼

permissions:
  contents: write

concurrency:
  group: monthly-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: 의존성 설치
        run: pip install pandas numpy

      # 원자료 연장 (기존 행 무수정 append-only · 수정주가 비율 이음 · 장중 가드)
      - name: 원자료 연장
        run: python3 deploy/refresh_hist.py

      # 4개 시나리오 재계산 → strategy_stats.json + signal.json 내장 사본
      - name: 성과 스냅샷 재계산
        run: python3 deploy/build_stats.py

      # [v197] 낙폭 백분위 자(ruler) — 원자료를 위에서 연장했으니 파생물도 같이 민다.
      #   v164 는 「연 1회 수동」으로 뒀지만, 원자료 연장이 자동인데 파생물만 수동이면
      #   조용히 낡는다(v171 성과표와 같은 유형). 1초 · 같은 원자료면 산출도 같다.
      - name: 낙폭 백분위 갱신
        run: python3 research/emit_dd_distribution.py

      # 검증을 통과할 때만 커밋한다 — 실패하면 이 달은 갱신을 건너뛴다
      - name: 불변식 검증
        run: python3 verify_all.py

      - name: 변경분 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # [2026-09-04] 01_Strategy_Logic.md 를 목록에 넣는다 — build_stats.py 는
          #   data/ 말고 이 문서도 쓴다(sync_doc, v73 에서 추가). 그런데 git add 에는
          #   안 들어가 있어서 러너가 정리될 때 문서 수정분이 **조용히 버려졌다.**
          #   그래서 사상 첫 실행(2026-09-01)부터 문서가 자기 JSON 과 어긋났다 —
          #   문서 40.12% vs strategy_stats.json 38.91% (원화·실물 TIGER CAGR, 1.21%p).
          OUTPUTS=(
            data/strategy_stats.json data/signal.json data/dd_percentile.json
            data/hist/yahoo_TNX.csv data/hist/lbma_gold_pm.csv data/hist/fred_DEXKOUS.csv
            data/hist/kr__5EKS11.csv data/hist/kr_133690_KS.csv
            data/hist/kr_418660_KS.csv data/hist/kr_458730_KS.csv
            data/hist/kr_305080_KS.csv data/hist/kr_411060_KS.csv
            qqq_us_d.csv qld_us_d.csv schd_us_d.csv 01_Strategy_Logic.md
          )
          git add -- "${OUTPUTS[@]}"

          # 같은 유형의 재발 방지 — 자각이 아니라 관문으로(v148).
          # 스크립트가 앞으로 새 파일을 쓰기 시작하면 조용히 버리지 말고 여기서 멈춘다.
          LEFT_TRACKED="$(git diff --name-only)"
          LEFT_UNTRACKED="$(git ls-files --others --exclude-standard)"
          if [ -n "${LEFT_TRACKED}${LEFT_UNTRACKED}" ]; then
            echo "::error::스테이징에서 빠진 변경이 있다 — 위 git add 목록을 갱신하라"
            echo "$LEFT_TRACKED"
            echo "$LEFT_UNTRACKED"
            exit 1
          fi

          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            END=$(python3 -c "import json;print(json.load(open('data/strategy_stats.json'))['scenarios'][0]['strategies']['B']['end'])")
            git commit -m "stats: 월간 스냅샷 갱신 — 곡선 ${END} 까지"
            # [v203] non-fast-forward면 옛 코드가 만든 원자료·파생물을 새 코드 위에
            # rebase하지 않는다. 기존 산출물을 되돌린 뒤 재계산해도 옛 코드가 새로 만든
            # 파일·행을 완전히 식별할 수 없으므로 실패-폐쇄하고 아래 알림으로 남긴다.
            # 수동 재실행은 최신 HEAD를 새로 checkout해 처음부터 계산한다.
            git push
          fi

      # [v73] 실패 알림 — Telegram/Discord (GitHub Secrets, 미설정이면 조용히 생략)
      - name: 실패 알림
        if: failure()
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 deploy/notify.py "월간 성과 스냅샷" failure "실패 스텝은 위 로그 링크에서 확인"
