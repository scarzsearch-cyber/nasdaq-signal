name: 월간 성과 스냅샷 갱신

on:
  schedule:
    # 매월 1일 07:17 UTC = 16:17 KST. 미국장(13:30~20:00 UTC 진행일 기준)과
    # 한국장(00:00~06:30 UTC) 이 **둘 다 닫혀 있는** 시각 — 장중가 오염 불가.
    # 분은 daily-signal 과 같은 :17 (혼잡한 :00/:30 회피).
    - cron: '17 7 1 * *'
  workflow_dispatch:        # 수동 실행 버튼

permissions:
  contents: write

concurrency:
  group: monthly-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: 의존성 설치
        run: pip install pandas numpy

      # 원자료 연장 (기존 행 무수정 append-only · 수정주가 비율 이음 · 장중 가드)
      - name: 원자료 연장
        run: python3 deploy/refresh_hist.py

      # 4개 시나리오 재계산 → strategy_stats.json + signal.json 내장 사본
      - name: 성과 스냅샷 재계산
        run: python3 deploy/build_stats.py

      # 검증을 통과할 때만 커밋한다 — 실패하면 이 달은 갱신을 건너뛴다
      - name: 불변식 검증
        run: python3 verify_all.py

      - name: 변경분 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ qqq_us_d.csv qld_us_d.csv schd_us_d.csv
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            END=$(python3 -c "import json;print(json.load(open('data/strategy_stats.json'))['scenarios'][0]['strategies']['B']['end'])")
            git commit -m "stats: 월간 스냅샷 갱신 — 곡선 ${END} 까지"
            git push
          fi

      # [v73] 실패 알림 — Telegram/Discord (GitHub Secrets, 미설정이면 조용히 생략)
      - name: 실패 알림
        if: failure()
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 deploy/notify.py "월간 성과 스냅샷" failure "실패 스텝은 위 로그 링크에서 확인"
