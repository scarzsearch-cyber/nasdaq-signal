name: GitHub Pages 배포

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    # daily-signal.yml이 기본 GITHUB_TOKEN으로 커밋/푸시하면 GitHub이 무한루프
    # 방지를 위해 push 이벤트로 이 워크플로를 재트리거하지 않는다. 그래서
    # daily-signal.yml 완료를 직접 구독해 재배포되게 한다.
    workflows: ["일일 신호 갱신"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # signal.html 의 마지막 커밋 날짜를 읽으려면 전체 이력이 필요하다
      - uses: actions/configure-pages@v6
      - name: 사이트 파일 모으기
        run: |
          mkdir -p _site/data
          cp signal.html _site/index.html
          # [v46] 화면(전략 로직) 자체의 개정 시점을 박는다. 종가 갱신과 별개다.
          python3 deploy/stamp_rev.py _site/index.html
          cp data/signal.json _site/data/ 2>/dev/null || echo "signal.json 없음 — 첫 실행이면 정상"
          cp data/strategy_stats.json _site/data/ 2>/dev/null || echo "strategy_stats.json 없음 — 성과 패널만 숨겨짐"
          cp data/kr_holidays.json _site/data/ 2>/dev/null || echo "kr_holidays.json 없음 — 시계가 주말만 반영"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
