name: GitHub Pages 배포

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    # daily-signal.yml이 기본 GITHUB_TOKEN으로 커밋/푸시하면 GitHub이 무한루프
    # 방지를 위해 push 이벤트로 이 워크플로를 재트리거하지 않는다. 그래서
    # daily-signal.yml 완료를 직접 구독해 재배포되게 한다.
    # [v173] price.yml 도 같은 이유로 배포가 안 되고 있었다 — 봇 커밋이라 push 가
    #   안 생기는데 여기 목록에도 없었다. 실측(2026-09-01): 저장소 main 은 15:40,
    #   배포된 사이트는 09:06 — 장중 내내 6시간 묵은 값을 보여주고 있었다.
    #   즉 v145 이후 시세는 「사람이 push 한 날에만」 갱신됐다.
    #   비용: 한국장 중 최대 14회/일 배포. 공개 저장소라 Actions 분은 무료이고,
    #   Pages 의 시간당 10빌드 제한은 커스텀 워크플로엔 적용되지 않는다(공식 문서).
    workflows: ["일일 신호 갱신", "price"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # signal.html 의 마지막 커밋 날짜를 읽으려면 전체 이력이 필요하다
      - uses: actions/configure-pages@v6
      - name: 사이트 파일 모으기
        run: |
          mkdir -p _site/data
          cp signal.html _site/index.html
          cp guide.html _site/guide.html   # [v78] 설명서 탭
          cp notes.html _site/notes.html   # [v142] 업데이트 노트 탭
          # [v104] PWA 홈 화면 추가 — 복사 누락 시 라이브 404 (guide.html v78 실사고와 동일 유형)
          cp manifest.json _site/manifest.json
          cp icon-192.png _site/icon-192.png
          cp icon-512.png _site/icon-512.png
          # [v46] 화면(전략 로직) 자체의 개정 시점을 박는다. 종가 갱신과 별개다.
          python3 deploy/stamp_rev.py _site/index.html
          cp data/signal.json _site/data/ 2>/dev/null || echo "signal.json 없음 — 첫 실행이면 정상"
          cp data/strategy_stats.json _site/data/ 2>/dev/null || echo "strategy_stats.json 없음 — 성과 패널만 숨겨짐"
          cp data/kr_holidays.json _site/data/ 2>/dev/null || echo "kr_holidays.json 없음 — 시계가 주말만 반영"
          # [v57] 규칙 동결 기록 + 전향적 OOS 장부
          cp data/freeze.json _site/data/ 2>/dev/null || echo "freeze.json 없음 — 동결 배지 숨김"
          cp data/oos_log.csv _site/data/ 2>/dev/null || echo "oos_log.csv 없음 — 첫 실행이면 정상"
          # [v89] 포트폴리오 패널의 현재가 기본값 (전일 종가·괴리율 수집분)
          cp data/nav_history.csv _site/data/ 2>/dev/null || echo "nav_history.csv 없음 — 가격 직접 입력"
          # [v127] 위기 타임머신 (research/build_crisis_paths.py 수동 생성분)
          cp data/crisis_paths.json _site/data/ 2>/dev/null || echo "crisis_paths.json 없음 — 타임머신 숨김"
          # [v140] 자동 파수꾼의 점검 결과 — 사람이 파이썬을 돌리지 않아도 화면에 뜬다
          cp data/ops_check.json _site/data/ 2>/dev/null || echo "ops_check.json 없음 — 점검 줄 숨김"
          cp data/price.json _site/data/ 2>/dev/null || echo "price.json 없음 — 시세 배지 숨김"
          cp data/dd_percentile.json _site/data/ 2>/dev/null || echo "dd_percentile.json 없음 — 낙폭 백분위 숨김"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
