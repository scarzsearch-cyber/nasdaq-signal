name: 일일 신호 갱신

on:
  schedule:
    # 22:30 UTC = 한국시간 07:30 (다음날). 미국장 마감(20:00~21:00 UTC) 이후이고
    # 한국장 개장(09:00 KST)보다 앞선다. 평일(UTC 기준 월~금)만 실행.
    - cron: '30 22 * * 1-5'
    # [v35] 예비 슬롯. GitHub 예약 실행은 부하가 걸리면 **통째로 건너뛴다**
    # (2026-08-26 22:30 UTC 분이 실행되지 않아 8/26 종가가 하루 늦었다).
    # 아래 두 번을 더 두면 한 번 놓쳐도 한국장 개장(09:00 KST) 전에 따라잡는다.
    # 이미 최신이면 "변경 없음"으로 끝나므로 중복 실행은 무해하다.
    - cron: '30 23 * * 1-5'   # 08:30 KST
    - cron: '30 0 * * 2-6'    # 09:30 KST (UTC 기준 하루 밀리므로 화~토)
  workflow_dispatch:        # 수동 실행 버튼

permissions:
  contents: write           # 갱신 결과를 커밋하려면 필요

concurrency:
  group: daily-signal
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: 의존성 설치
        run: pip install pandas numpy

      - name: 종가 받아 신호 갱신
        run: python3 deploy/update_signal.py

      # 국내 ETF 실측 NAV 한 줄 적립 (진짜 괴리율 시계열). 실패해도 신호 갱신은 살린다.
      - name: 실측 NAV 수집
        continue-on-error: true
        run: python3 deploy/nav_collect.py

      - name: 변경분 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "변경 없음 (휴장일이거나 이미 최신)"
          else
            git commit -m "signal: $(date -u +%Y-%m-%d) 종가 반영 · NAV 적립"
            git push
          fi
