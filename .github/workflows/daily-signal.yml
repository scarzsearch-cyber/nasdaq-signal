name: 일일 신호 갱신

on:
  schedule:
    # [v75] 대기 루프 체제: 아래 트리거 중 **하나만 떠도** wait_close.py 가 종가가
    # 반영될 때까지 240초 간격으로 재시도한다 (최대 170분). GitHub 이 슬롯을
    # 건너뛰어도(실측: 8/26 전부, 8/29 06:17·06:47) 한 개만 살면 창 전체가 커버된다.
    # 목표: 미국 종가 확정(05:00 KST) → 한국 개장(09:00 KST) 안 반영.
    - cron: '17 20 * * 1-5'   # 05:17 KST — 마감 직후 첫 시도
    - cron: '17 21 * * 1-5'   # 06:17 KST
    - cron: '47 22 * * 1-5'   # 07:47 KST
    - cron: '17 0 * * 2-6'    # 09:17 KST — 개장 후 최종 안전망 (UTC 하루 밀림)
  workflow_dispatch:        # 수동 실행 버튼

permissions:
  contents: write           # 갱신 결과를 커밋하려면 필요

concurrency:
  group: daily-signal
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: 의존성 설치
        run: pip install pandas numpy

      # [v75] 종가가 나올 때까지 대기 루프. 이미 최신이면 즉시 종료(커밋 안 생김).
      - name: 종가 확정 대기 + 신호 갱신
        run: python3 deploy/wait_close.py

      # [v76] 전환 신호가 뜬 날만 폰 알림 (secret 미설정 시 조용히 생략)
      - name: 전환 신호 알림
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 deploy/signal_alert.py

      # 국내 ETF 실측 NAV 한 줄 적립 (진짜 괴리율 시계열). 실패해도 신호 갱신은 살린다.
      - name: 실측 NAV 수집
        continue-on-error: true
        run: python3 deploy/nav_collect.py

      # [v57] 규칙 동결(2026-08-27) 이후를 하루 한 줄씩 덧붙인다. 순수 OOS 표본.
      - name: OOS 장부 기록
        continue-on-error: true
        run: python3 deploy/oos_log.py

      - name: 변경분 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "변경 없음 (휴장일이거나 이미 최신)"
          else
            # 실행일이 아니라 **종가 날짜**(as_of)를 적는다. 실행이 늦어진 날
            # "8/28 종가"라고 찍혔지만 실제로는 8/27 종가였던 혼동을 막는다.
            ASOF=$(python3 -c "import json; print(json.load(open('data/signal.json'))['as_of'])")
            git commit -m "signal: ${ASOF} 미국 종가 반영 · NAV 적립"
            git push
          fi

      # [v73] 실패 알림 — Telegram/Discord (GitHub Secrets, 미설정이면 조용히 생략)
      - name: 실패 알림
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 deploy/notify.py "일일 신호 갱신" failure "실패 스텝은 위 로그 링크에서 확인"
