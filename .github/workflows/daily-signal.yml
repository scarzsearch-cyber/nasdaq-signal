name: 일일 신호 갱신

on:
  schedule:
    # 미국장 마감 20:00 UTC(서머타임)~21:00 UTC(겨울), 한국장 개장 00:00 UTC(=09:00 KST).
    # GitHub 예약 실행은 보장이 아니라 **최선노력**이다 — 부하가 걸리면 통째로 건너뛰거나
    # 몇 시간 몰아서 늦게 실행한다. 실측: 8/26 은 3슬롯 전부 누락(수동 실행으로 때움),
    # 8/27 종가는 8/28 **15:04 KST** 에야 반영(개장 6시간 뒤) — 3슬롯으로도 부족했다.
    # [v66] 대응: 슬롯 3→7개, 혼잡한 :00/:30 분을 피해 :17/:47 로 이동 (GitHub 공식 권고).
    # 스크립트가 멱등(이미 최신이면 "변경 없음")이라 몇 번을 돌아도 무해하다.
    - cron: '17 21 * * 1-5'   # 06:17 KST — 겨울엔 마감 17분 뒤라 이를 수 있음. 뒤 슬롯이 받친다.
    - cron: '47 21 * * 1-5'   # 06:47 KST
    - cron: '17 22 * * 1-5'   # 07:17 KST
    - cron: '47 22 * * 1-5'   # 07:47 KST
    - cron: '17 23 * * 1-5'   # 08:17 KST
    - cron: '47 23 * * 1-5'   # 08:47 KST — 개장 전 마지막
    - cron: '17 0 * * 2-6'    # 09:17 KST — 개장 후 따라잡기 (UTC 기준 하루 밀려 화~토)
  workflow_dispatch:        # 수동 실행 버튼

permissions:
  contents: write           # 갱신 결과를 커밋하려면 필요

concurrency:
  group: daily-signal
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: 의존성 설치
        run: pip install pandas numpy

      - name: 종가 받아 신호 갱신
        run: python3 deploy/update_signal.py

      # 국내 ETF 실측 NAV 한 줄 적립 (진짜 괴리율 시계열). 실패해도 신호 갱신은 살린다.
      - name: 실측 NAV 수집
        continue-on-error: true
        run: python3 deploy/nav_collect.py

      # [v57] 규칙 동결(2026-08-27) 이후를 하루 한 줄씩 덧붙인다. 순수 OOS 표본.
      - name: OOS 장부 기록
        continue-on-error: true
        run: python3 deploy/oos_log.py

      - name: 변경분 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "변경 없음 (휴장일이거나 이미 최신)"
          else
            # 실행일이 아니라 **종가 날짜**(as_of)를 적는다. 실행이 늦어진 날
            # "8/28 종가"라고 찍혔지만 실제로는 8/27 종가였던 혼동을 막는다.
            ASOF=$(python3 -c "import json; print(json.load(open('data/signal.json'))['as_of'])")
            git commit -m "signal: ${ASOF} 미국 종가 반영 · NAV 적립"
            git push
          fi

      # [v73] 실패 알림 — Telegram/Discord (GitHub Secrets, 미설정이면 조용히 생략)
      - name: 실패 알림
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 deploy/notify.py "일일 신호 갱신" failure "실패 스텝은 위 로그 링크에서 확인"
