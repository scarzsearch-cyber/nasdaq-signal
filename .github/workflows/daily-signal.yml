name: 일일 신호 갱신

on:
  schedule:
    # [v75] 대기 루프 체제: 아래 트리거 중 **하나만 떠도** wait_close.py 가 종가가
    # 반영될 때까지 240초 간격으로 재시도한다 (최대 170분). GitHub 이 슬롯을
    # 건너뛰어도(실측: 8/26 전부, 8/29 06:17·06:47) 한 개만 살면 창 전체가 커버된다.
    # 목표: 미국 종가 확정(05:00 KST) → 한국 개장(09:00 KST) 안 반영.
    #
    # [v190] 마감 **전** 슬롯 — 「마감 뒤 5분 안」 반영 (소유자 2026-09-02: 05:25 는 늦다).
    #   wait_close.py 가 마감까지 자고 20초 간격으로 종가가 굳는 순간을 잡는다.
    #   예약 지연(실측 4~18분)을 25분 여유로 흡수한다. 서머타임 마감은 05:00 KST,
    #   겨울 마감은 06:00 KST — 두 벌을 두면 어느 계절이든 한 벌은 마감 전에 뜨고
    #   다른 한 벌은 예비가 된다(이미 최신이면 23초 만에 종료). 아래 v75 슬롯은 그대로 예비.
    - cron: '35 19 * * 1-5'   # 04:35 KST — 여름(05:00 마감) 25분 전 · 겨울엔 85분 대기
    - cron: '45 19 * * 1-5'   # 04:45 KST — 위 슬롯이 버려질 때의 예비
    - cron: '35 20 * * 1-5'   # 05:35 KST — 겨울(06:00 마감) 25분 전 · 여름엔 즉시 종료
    - cron: '45 20 * * 1-5'   # 05:45 KST
    - cron: '17 20 * * 1-5'   # 05:17 KST — 마감 직후 첫 시도 (v190 부터는 예비)
    - cron: '17 21 * * 1-5'   # 06:17 KST
    - cron: '47 22 * * 1-5'   # 07:47 KST
    - cron: '17 0 * * 2-6'    # 09:17 KST — 개장 후 최종 안전망 (UTC 하루 밀림)
  workflow_dispatch:        # 수동 실행 버튼

permissions:
  contents: write           # 갱신 결과를 커밋하려면 필요
  issues: write             # 전환 알림 채널이 죽었을 때 마지막 메일 통로

concurrency:
  group: daily-signal
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # [v206] 예약 실행은 **큐에 들어갈 때의 커밋**(github.sha)을 체크아웃한다. 마감 전 슬롯
      #   둘(04:35·04:45)이 함께 큐에 들어가면 둘째 슬롯은 첫째가 커밋한 **뒤에** 돌면서도
      #   첫째 커밋 이전의 main 을 보고 같은 종가를 다시 계산해 push 에서 거부됐다
      #   (실측 gh run list: 09-03·09-04·09-05 매일 04:48 슬롯 실패 + 실패 카톡 1통).
      #   최신 main 으로 맞추면 둘째 슬롯은 「이미 최신」으로 23초 만에 끝난다.
      #   이 시점엔 작업 트리에 변경이 없으므로 reset --hard 가 잃는 것은 없다.
      - name: 최신 main 으로 맞추기
        run: |
          git fetch --no-tags origin main
          git reset --hard origin/main

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # repository secret은 잡이 대기열에 들어갈 때의 값이다. 한 번만 GITHUB_ENV에
      # 초기화하고, notify/keepalive가 회전 토큰을 쓰면 뒤 스텝은 그 새 값을 이어받는다.
      - name: 카카오 refresh 토큰 초기화
        env:
          INITIAL_KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
        run: |
          if [ -n "$INITIAL_KAKAO_REFRESH_TOKEN" ]; then
            case "$INITIAL_KAKAO_REFRESH_TOKEN" in
              *$'\n'*|*$'\r'*) echo "::error::카카오 refresh 토큰에 줄바꿈이 있다"; exit 1 ;;
            esac
            printf 'KAKAO_REFRESH_TOKEN=%s\n' "$INITIAL_KAKAO_REFRESH_TOKEN" >> "$GITHUB_ENV"
          fi

      - name: 의존성 설치
        run: pip install pandas numpy

      # [v75] 종가가 나올 때까지 대기 루프. 이미 최신이면 즉시 종료(커밋 안 생김).
      - name: 종가 확정 대기 + 신호 갱신
        run: python3 deploy/wait_close.py

      # [v76] 전환 신호가 뜬 날만 폰 알림 (secret 미설정 시 조용히 생략)
      - name: 전환 신호 알림
        id: sigalert
        continue-on-error: true
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          GH_PAT: ${{ secrets.GH_PAT }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 deploy/signal_alert.py

      # OOS 장부는 알림과 독립적으로 계속 쌓되, 전환 알림 실패는 이슈(메일)로 남긴다.
      # 같은 종가일의 후속 슬롯이 재시도해도 열린 이슈는 하나만 만든다.
      - name: 전환 알림 실패 이슈
        id: sigissue
        if: steps.sigalert.outcome == 'failure'
        continue-on-error: true   # 이슈 API 장애가 NAV/OOS·신호 커밋을 막으면 안 된다
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const sig = JSON.parse(fs.readFileSync('data/signal.json', 'utf8'));
            const asof = sig.as_of || new Date().toISOString().slice(0, 10);
            const title = `전환 신호 알림 실패 — ${asof}`;
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100
            });
            if (!open.some(issue => issue.title === title)) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title,
                body: `전환 신호는 계산됐지만 폰 알림이 도착하지 않았습니다.\n\n로그: ${url}\n\n화면을 열어 오늘의 행동을 확인하고, 알림 채널을 재설정하세요.`
              });
            }

      # [v77/v203] 카카오 refresh 토큰 연명. 새 토큰 발급 즉시 옛 토큰은 무효이므로
      # GH_PAT 저장 실패/미설정이면 살아 있는 access 토큰으로 즉시 재설정 경고를 보낸다.
      - name: 카카오 토큰 연명
        id: keepalive
        continue-on-error: true
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python3 deploy/kakao_keepalive.py

      # 국내 ETF 실측 NAV 한 줄 적립 (진짜 괴리율 시계열). 실패해도 신호 갱신은 살린다.
      - name: 실측 NAV 수집
        id: navlog
        continue-on-error: true
        run: python3 deploy/nav_collect.py

      # [v57] 규칙 동결(2026-08-27) 이후를 하루 한 줄씩 덧붙인다. 순수 OOS 표본.
      - name: OOS 장부 기록
        id: ooslog
        continue-on-error: true
        run: python3 deploy/oos_log.py

      # 실측 장부는 다음 슬롯이 다시 시도할 수 있지만, 조용히 빠진 날이 되지 않게 이슈로 남긴다.
      - name: 실측 장부 실패 이슈
        id: ledgerissue
        if: steps.navlog.outcome == 'failure' || steps.ooslog.outcome == 'failure'
        continue-on-error: true   # 실패 보고 통로가 핵심 신호 커밋보다 우선할 수 없다
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let asof = new Date().toISOString().slice(0, 10);
            try { asof = JSON.parse(fs.readFileSync('data/signal.json', 'utf8')).as_of || asof; } catch (_) {}
            const failed = [];
            if ('${{ steps.navlog.outcome }}' === 'failure') failed.push('NAV 실측 장부');
            if ('${{ steps.ooslog.outcome }}' === 'failure') failed.push('OOS 동결 장부');
            const title = `실측 장부 기록 실패 — ${asof}`;
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100
            });
            if (!open.some(issue => issue.title === title)) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title,
                body: `${failed.join('·')} 기록을 보존하기 위해 쓰기를 중단했습니다. 다음 예약 슬롯이 다시 시도합니다.\n\n로그: ${url}`
              });
            }

      - name: 변경분 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 이 잡이 쓸 수 있는 장부만 명시한다. 새 산출물이 생기면 자동으로 함께 밀지 않고
          # 아래 관문에서 멈춰, 배포 범위가 코드 변경만으로 조용히 넓어지지 않게 한다.
          git add -- data/qqq.csv data/signal.json data/signal_alert_state.json \
            data/nav_history.csv data/oos_log.csv
          LEFT_TRACKED="$(git diff --name-only)"
          LEFT_UNTRACKED="$(git ls-files --others --exclude-standard)"
          if [ -n "${LEFT_TRACKED}${LEFT_UNTRACKED}" ]; then
            echo "::error::일일 잡의 허용 목록 밖 변경이 있다"
            echo "$LEFT_TRACKED"
            echo "$LEFT_UNTRACKED"
            exit 1
          fi
          if git diff --staged --quiet; then
            echo "변경 없음 (휴장일이거나 이미 최신)"
          else
            # 실행일이 아니라 **종가 날짜**(as_of)를 적는다. 실행이 늦어진 날
            # "8/28 종가"라고 찍혔지만 실제로는 8/27 종가였던 혼동을 막는다.
            ASOF=$(python3 -c "import json; print(json.load(open('data/signal.json'))['as_of'])")
            git commit -m "signal: ${ASOF} 미국 종가 반영 · NAV 적립"
            # [v206] push 직전에 원격을 다시 본다. 마감을 기다리는 사이(최대 25분) 원격이
            #   움직였고 그 원격이 **이미 같은(또는 더 새) 종가**를 반영했다면 이 커밋은
            #   중복이라 버린다 — 정상 종료(실패 카톡을 만들지 않는다).
            #   다른 이유로 움직였으면(코드 push 등) 아래 v203 규약대로 실패-폐쇄한다.
            git fetch --no-tags origin main
            if ! git merge-base --is-ancestor origin/main HEAD; then
              REMOTE_ASOF=$(git show origin/main:data/signal.json | python3 -c "import json,sys; print(json.load(sys.stdin).get('as_of',''))")
              if [ -n "$REMOTE_ASOF" ] && [ ! "$REMOTE_ASOF" \< "$ASOF" ]; then
                echo "원격 main 이 이미 ${REMOTE_ASOF} 종가를 반영했다 — 이 실행의 중복 커밋은 버린다(정상)"
                exit 0
              fi
              echo "::error::기다리는 사이 원격 main 이 움직였다(원격 as_of ${REMOTE_ASOF:-없음} < ${ASOF}) — 다음 슬롯이 최신 HEAD 에서 다시 계산한다"
              exit 1
            fi
            # [v203] non-fast-forward면 옛 코드로 만든 signal/NAV/OOS를 새 코드 위에
            # rebase해 밀지 않는다. 실패-폐쇄하면 8개 예비 슬롯 중 다음 슬롯이 새 HEAD로
            # 처음부터 다시 계산한다. 실패 알림도 아래 스텝에서 남는다.
            git push
          fi

      # 이슈 API 장애는 핵심 신호 커밋 전에는 비차단이지만, 커밋 뒤에는 다시
      # 실패로 드러내 빨간 실행과 마지막 알림을 남긴다. 성공을 가장하지 않는다.
      - name: 실패 보고 통로 상태 확정
        if: always()
        run: |
          if [ "${{ steps.sigissue.outcome }}" = "failure" ] || \
             [ "${{ steps.ledgerissue.outcome }}" = "failure" ] || \
             [ "${{ steps.keepalive.outcome }}" = "failure" ]; then
            echo "::error::이슈 실패 보고 통로 또는 카카오 토큰 연명이 작동하지 않았다"
            exit 1
          fi

      # [v73] 실패 알림 — Telegram/Discord (GitHub Secrets, 미설정이면 조용히 생략)
      - name: 실패 알림
        if: failure()
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          GH_PAT: ${{ secrets.GH_PAT }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 deploy/notify.py "일일 신호 갱신" failure "실패 스텝은 위 로그 링크에서 확인"
