# [v145] 4다리 시세 스냅샷 — 소유자가 주식앱을 따로 안 봐도 되게.
#
# ★ 전략 무접촉: 신호 판정은 daily-signal.yml 이 QQQ 미국 종가로만 한다(동결 규칙).
#   이 워크플로는 **화면 표시용 숫자**만 만들며, 실패해도 신호에 영향이 없다.
#   그래서 알림도 걸지 않는다 — 시세가 낡으면 화면이 「몇 분 전」으로 스스로 밝힌다.
#
# 주기: 한국장 중 **5분마다** (00:00~06:55 UTC = 09:00~15:55 KST).
#   [v176] 종전 30분 -> 5분. GitHub 예약 실행의 최소 간격이 5분이라 이보다 촘촘히는
#   불가능하다(공식 문서). 예약은 부하가 높으면 지연·드롭되므로 「정확히 5분마다」를
#   보장하지 않으며, 화면이 스냅샷 시각을 항상 표시한다.
#
# ★ [v176] 결과물을 main 이 아니라 **price-data 브랜치**에 **항상 커밋 1개**로
#   force-push 한다. 30분일 때도 최근 20건 중 14건이 시세 커밋이라 `git log` 가
#   덮이고 있었다 — 5분이면 그 4배다. 이력을 나중에 지우는 것은 금지다
#   (CLAUDE.md §0: 이 커밋 이력이 「규칙 무변경」의 증거라 다시 쓰면 증거가 죽는다).
#   그래서 **애초에 안 쌓는 쪽**으로 간다. main 의 시세 커밋은 이제 0건이다.
name: price

on:
  schedule:
    - cron: '*/5 0-6 * * 1-5'       # 09:00~15:55 KST 5분 간격 (월~금) [v176]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: price
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 시세 수집
        run: python deploy/price_now.py

      # [v176] main 이 아니라 price-data 브랜치에 **항상 커밋 1개**로 덮어쓴다.
      #   orphan 브랜치를 매번 새로 만들어 force-push 하므로 이력이 안 쌓인다.
      #   ★ 수집 실패 시 price_now.py 는 파일을 쓰지 않는다(기존 값을 지어내지 않는 규약) —
      #     그 경우 브랜치를 그대로 두어 **마지막 정상 스냅샷이 살아 있게** 한다.
      - name: 시세 브랜치에 덮어쓰기
        run: |
          if [ ! -f data/price.json ]; then
            echo "수집 실패 — 브랜치를 그대로 둔다(마지막 정상 스냅샷 유지)"; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 값이 그대로면 배포까지 헛돌 이유가 없다 — 시각(as_of)은 빼고 items 만 비교한다.
          if git fetch -q --depth=1 origin price-data 2>/dev/null \
             && git show FETCH_HEAD:data/price.json > /tmp/prev.json 2>/dev/null \
             && python3 -c "import json,sys; sys.exit(0 if json.load(open('/tmp/prev.json')).get('items')==json.load(open('data/price.json')).get('items') else 1)"; then
            echo "시세 변화 없음 — 브랜치 갱신 생략"; exit 0
          fi
          git checkout -q --orphan price-tmp
          # -f 필수: 방금 수집이 data/price.json 을 고쳐 놔서 인덱스와 어긋난다.
          #   --cached 라 작업트리 파일은 그대로 남는다(다음 줄에서 다시 add 한다).
          git rm -rqf --cached . > /dev/null
          git add -f data/price.json
          git commit -q -m "price: $(date -u +%Y-%m-%dT%H:%MZ) 스냅샷 (항상 커밋 1개)"
          git push -qf origin price-tmp:price-data
          echo "price-data 브랜치 갱신 완료"
