name: 알림 테스트

# [v76] secret 등록 후 연결 확인용. Actions 탭에서 수동 실행(Run workflow)하면
# 등록된 채널(Discord/Telegram)로 테스트 메시지가 간다. 예약 실행 없음.
on:
  workflow_dispatch:

# [2026-09-06 보안 감사] 8개 워크플로 중 유일하게 permissions 가 없어 저장소 기본 권한(write)을 물려받았다.
#   이 잡은 GITHUB_TOKEN 을 쓰지 않는다(알림 secrets 만) — 읽기로 고정.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7 = v7.0.1 (2026-09-06 SHA 고정 · audit/OPS_CONFIG_2026-09-06.md)
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # v7 = v7.0.0 (2026-09-06 SHA 고정 · audit/OPS_CONFIG_2026-09-06.md)
        with:
          python-version: '3.12'
      - name: 테스트 발송
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 deploy/notify.py "알림 테스트" success "이 메시지가 보이면 연결 성공입니다. 실패 알림과 전환 신호 알림이 이 채널로 옵니다."
