name: 자동 파수꾼

# [v140] 기존 알림은 「워크플로가 돌다가 실패했을 때」만 온다(if: failure()).
# 정작 무서운 것은 그 반대다 — **아무 일도 안 일어나는 것**:
#   ① 예약이 통째로 건너뛰어 신호가 며칠째 그대로 (실패가 아니라 알림도 없다)
#   ② 카카오 토큰이 죽어 정작 전환일에 알림이 안 감 (경고가 stderr 로만 나갔다)
#   ③ 분기 점검을 사람이 기억해서 돌려야 했던 것
#   ④ [v171] 월간 성과 스냅샷이 건너뛰어 성과표가 조용히 낡는 것
#   ⑤ [v192] 실행 규율 — 전환 실행일 아침 재알림 · 근접 진입 알림 (일정이지 이상이 아니다)
# 이 워크플로가 이것들을 대신 본다. 평시에는 아무 말도 하지 않는다.
#
# 전략 무접촉 — 판정·파라미터·장부는 읽기만 한다.

on:
  schedule:
    - cron: '40 23 * * 0-4'   # 08:40 KST 평일 (UTC 하루 밀림) — 한국장 개장 20분 전
    - cron: '10 0 * * 1'      # 09:10 KST 월요일 — 자동 점검(전제·상품·비용)
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: watchdog
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    env:
      # 월요일 슬롯(과 수동 실행)에서만 무거운 점검을 돌린다.
      WEEKLY: ${{ github.event.schedule == '10 0 * * 1' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # 한 잡 안에서 refresh 토큰이 회전하면 GITHUB_ENV의 새 값을 후속 모드가 쓴다.
      # 각 step에서 queued secret을 재선언하면 새 값이 다시 옛 값으로 덮이므로 여기서 한 번만 초기화한다.
      - name: 카카오 refresh 토큰 초기화
        env:
          INITIAL_KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
        run: |
          if [ -n "$INITIAL_KAKAO_REFRESH_TOKEN" ]; then
            case "$INITIAL_KAKAO_REFRESH_TOKEN" in
              *$'\n'*|*$'\r'*) echo "::error::카카오 refresh 토큰에 줄바꿈이 있다"; exit 1 ;;
            esac
            printf 'KAKAO_REFRESH_TOKEN=%s\n' "$INITIAL_KAKAO_REFRESH_TOKEN" >> "$GITHUB_ENV"
          fi

      # ① 신호가 며칠째 그대로인가 — 3영업일마다 한 번만 알린다(알림 피로 방지)
      - name: 신호 신선도
        id: stale
        # [2026-09-04 코드리뷰] 월요일은 08:40·09:10 두 슬롯이 뜨는데 일간 스텝이
        # 양쪽에서 다 돌아 **같은 알림이 30분 간격으로 두 번** 갔다(2026 전수 시뮬레이션에서
        # 확인 — 문턱을 넘는 날이 월요일이면 항상). 09:10 슬롯의 몫은 주간 점검이다.
        # 수동 실행(workflow_dispatch)은 schedule 이 비어 있으므로 그대로 전부 돈다.
        if: github.event.schedule != '10 0 * * 1'
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          GH_PAT: ${{ secrets.GH_PAT }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 deploy/watchdog.py stale

      # ①-b 오늘이 방어 재조정일인가 — 전환일엔 알림이 가는데 재조정일엔 안 갔다.
      # 둘 다 실제 매매인데 한쪽만 알림이 있으면 사람이 달력을 신경 써야 한다.
      - name: 방어 재조정일
        id: reb
        if: github.event.schedule != '10 0 * * 1'
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          GH_PAT: ${{ secrets.GH_PAT }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 deploy/watchdog.py rebalance

      # ①-c [v192] 전환 실행일 재알림 — 새벽(05시) 알림은 자는 동안 온다. 실행일 아침에 한 번 더.
      #   실행일에만 나가므로 거짓 알림 0 · 연 2~3건. 서버는 체결 여부를 모르므로 「이미 하셨다면 무시」.
      - name: 전환 실행일 재알림
        id: sw
        if: github.event.schedule != '10 0 * * 1'
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          GH_PAT: ${{ secrets.GH_PAT }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 deploy/watchdog.py switchday

      # ①-d [v192] 근접 진입 알림 — 게이지가 「근접」(3%p 미만)에 들어선 날 아침 한 번.
      #   「근접일 때의 전환은 절대 놓치지 마라」(04 §5-8)·「근접이면 떠나기 전 정리」(설명서 ③)가
      #   화면을 열어야만 작동하던 것을 폰으로 옮긴다. 54년 실측 연 3.5회(research/near_zone.py).
      - name: 근접 진입 알림
        id: near
        if: github.event.schedule != '10 0 * * 1'
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          GH_PAT: ${{ secrets.GH_PAT }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 deploy/watchdog.py near

      # ② 알림 채널이 살아 있나 — 메시지는 보내지 않고 자격증명만 확인(평시 소음 0)
      - name: 알림 채널 생존
        id: chan
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          GH_PAT: ${{ secrets.GH_PAT }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 deploy/watchdog.py channel

      # ②-b [v171] 성과 스냅샷이 갱신되고 있나 — monthly-stats 가 「안 돈」 경우.
      # 파일 한 개를 읽을 뿐이라 매일 돌려도 비용이 없다(45일 넘어야 말한다).
      - name: 성과 스냅샷 신선도
        id: stats
        if: github.event.schedule != '10 0 * * 1'
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          GH_PAT: ${{ secrets.GH_PAT }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 deploy/watchdog.py stats

      # ②-c [v176] 시세 수집이 살아 있나 — 죽으면 화면에서 배지가 조용히 사라진다.
      - name: 시세 수집 생존
        id: price
        if: github.event.schedule != '10 0 * * 1'
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          GH_PAT: ${{ secrets.GH_PAT }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 deploy/watchdog.py price

      - name: 의존성 설치
        if: env.WEEKLY == 'true'
        run: pip install pandas numpy

      # ③ 사람이 돌리던 점검을 대신 돌린다 → data/ops_check.json (화면이 읽는다)
      - name: 자동 점검
        id: chk
        if: env.WEEKLY == 'true'
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          GH_PAT: ${{ secrets.GH_PAT }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 deploy/watchdog.py check

      # ④ [v177] 월 1회 「살아 있음」 — 다른 알림은 전부 「이상할 때만」이라
      #   침묵이 정상인지 죽은 건지 구별이 안 됐다. 특히 60일 무활동이면 예약 실행이
      #   통째로 꺼지는데(공식 문서) 그러면 이 파수꾼도 같이 꺼진다.
      #   상태는 ops_check.json 에 얹으므로 새 파일·새 커밋이 안 늘어난다.
      - name: 살아 있음 알림 (월 1회)
        id: hb
        if: env.WEEKLY == 'true'
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          GH_PAT: ${{ secrets.GH_PAT }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 deploy/watchdog.py heartbeat

      # ⑤ [v195] 휴장일 표 연장 — 표는 2025~2032 로 **조용히 끝나는 파일**이다. 사람이 2032 년에 기억해서
      #   다시 만들 리 없으므로 매주 재생성해 해가 바뀌면 한 해씩 민다. 내용이 같으면 emit 이 파일을
      #   쓰지 않는다 → 커밋도 없다. 임시공휴일·선거일은 여전히 deploy/kr_holidays.py 의 SPECIAL 에 손으로.
      #   [2026-09-05 4차 · W4] 이 스텝이 실패하면(음력 표 소진 등) 앞서 쓴 ops_check.json 의 커밋까지
      #   막혔다 — 서로 무관한 산출물이다. 실패는 삼키지 않고 아래 이슈 조건이 outcome 으로 읽는다.
      - name: 휴장일 표 연장
        id: hol
        if: env.WEEKLY == 'true'
        continue-on-error: true
        run: python3 deploy/kr_holidays.py --emit

      # 화면 배포는 다음 「일일 신호 갱신」이 끌고 간다(pages.yml 이 그 완료를 구독).
      # 주 1회 갱신되는 파일이라 최대 1영업일 지연은 무의미 — 배포를 두 배로 돌리지 않는다.
      - name: 점검 결과 커밋
        if: env.WEEKLY == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ops_check.json data/kr_holidays.json
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            LV=$(python3 -c "import json;print(json.load(open('data/ops_check.json'))['level'])")
            git commit -m "ops: 자동 점검 — Level ${LV} (+생존 기록·휴장일 표)"
            # [v203] non-fast-forward면 옛 점검 코드의 산출물을 새 코드 위에 얹지 않는다.
            # 실패-폐쇄하고 이슈를 남기면 다음 주간 슬롯이 새 HEAD로 다시 계산한다.
            git push
          fi

      # 사람이 개입해야 하는 상황이면 이슈로도 남긴다 — 카톡이 죽었을 때의 마지막 통로
      # (GitHub 이 이슈를 메일로 보낸다). 라벨이 같은 열린 이슈가 있으면 댓글로 잇는다.
      - name: 이상이면 이슈 열기
        # [2026-09-04 코드리뷰] 9모드 전부 참조 — 종전엔 reb·sw·near·hb 에 id 가 없어
        # 그 4모드가 크래시할 때 남기는 alert=1 을 아무도 읽을 수 없었다(무음 실패).
        # watchdog.py 는 어떤 모드도 non-zero 로 끝나지 않으므로 이 조건이 유일한 통로다.
        if: >-
          always() && (failure() ||
          steps.stale.outputs.alert == '1' || steps.chan.outputs.alert == '1' ||
          steps.stats.outputs.alert == '1' || steps.price.outputs.alert == '1' ||
          steps.chk.outputs.alert == '1' || steps.reb.outputs.alert == '1' ||
          steps.sw.outputs.alert == '1' || steps.near.outputs.alert == '1' ||
          steps.hb.outputs.alert == '1' || steps.hol.outcome == 'failure')
        uses: actions/github-script@v7
        with:
          script: |
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              '자동 파수꾼이 사람이 봐야 할 상태를 찾았습니다.',
              '',
              `로그: ${url}`,
              '',
              '- **신호 신선도** — 자동 갱신이 멈췄다면 화면의 낙폭·상태가 옛 종가 기준입니다.',
              '- **알림 채널** — 이대로면 전환일에 알림이 오지 않습니다.',
              '- **성과 스냅샷** — 월간 갱신이 건너뛰어 성과 비교표가 낡았습니다(매매와 무관).',
              '- **시세 수집** — 자산 가격·괴리 배지가 화면에서 사라져 있습니다(매매와 무관).',
              '- **자동 점검** — 전제·상품·비용 중 하나가 주의선을 넘었습니다.',
              '- **휴장일 표 연장** — 실패했다면 다음 해 표가 안 늘어난 것입니다(deploy/kr_holidays.py · 매매와 무관).',
              '',
              '어느 쪽인지는 위 로그에 한국어로 찍혀 있습니다.',
              '**전략을 바꾸는 일이 아닙니다** — 기본 대응은 「지켜본다」입니다.'
            ].join('\n');
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'watchdog'
            });
            if (open.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: `파수꾼 알림 — ${new Date().toISOString().slice(0,10)}`,
                body, labels: ['watchdog']
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open[0].number, body
              });
            }
